name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: ffmpeg (the tests make and measure small videos)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
          ffmpeg -version | head -1
      - name: Repo scan
        run: node setup/scan-repo.mjs
      - name: Tests (no key, no network, no browser)
        shell: bash
        run: node setup/test-video.mjs
      - name: Licensed assets and update tests
        shell: bash
        run: |
          node setup/test-licensed.mjs
          node setup/test-update.mjs
          node setup/test-suggest.mjs
      - name: Blender support tests (own clips, library, terrain with a stubbed fetch; the real Blender part skips without Blender)
        shell: bash
        run: node setup/test-blender.mjs
      - name: Voice tests (the built-in voice, who spoke, estimated timings)
        shell: bash
        run: node setup/test-voice.mjs
      - name: Script flow tests (script check, human score, the gate before the voice)
        run: node setup/test-script.mjs
      - name: Quality tool tests (pace, captions, music plan, mix, thumbnail, A/B; numpy only improves the thumbnail text estimate, the Python parts skip without it)
        shell: bash
        run: |
          python3 -m pip install --quiet numpy || python -m pip install --quiet numpy || echo "numpy not installed: the tests that need it skip"
          node setup/test-quality.mjs
      - name: Generated shots tests (register types, label gate, the vertical render)
        run: node setup/test-generated.mjs
      - name: Retention tests (the channel review's retention section)
        run: node setup/test-retention.mjs
      - name: Competitor tracker tests (stubbed fetch and a fake token, no network, no real key)
        run: node setup/test-competitors.mjs
